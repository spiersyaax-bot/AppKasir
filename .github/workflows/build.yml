name: Android Debug Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Detect Android project directory
        id: project
        shell: bash
        run: |
          if [ -f "./KASIR/gradlew" ]; then
            echo "dir=./KASIR" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for Gradle
        shell: bash
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error